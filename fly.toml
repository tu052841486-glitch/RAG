# fly.toml app configuration file generated for pesticide-doctor-api on 2026-08-03T06:38:57+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pesticide-doctor-api'
primary_region = 'nrt'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
[mounts]
  source = "data"
  destination = "/app/data"
[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
